spring.application.name=recetas-service

server.port=8080

# Base de datos guardada en un archivo
spring.datasource.url=jdbc:h2:file:./data/martinichef_recetas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear y actualizar las tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false